<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu – Góc Phố Coffee</title>
  <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../" data-page="menu">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button>
        <h1>Menu</h1>
        <div class="userbox" id="userBox"></div>
      </header>
      <main class="content">
        <div class="toolbar">
          <input type="text" id="search" class="search" placeholder="Tìm tên món" aria-label="Tìm món">
          <span class="grow"></span>
          <button type="button" class="btn btn-primary owner-only" id="addBtn">Thêm món</button>
        </div>
        <div class="chips" id="cats" style="margin-bottom:14px" role="group" aria-label="Nhóm món"></div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Mã</th><th>Tên món</th><th>Nhóm</th><th class="right">Giá</th><th>Đang bán</th><th class="owner-only"><span class="sr-only">Thao tác</span></th></tr></thead>
            <tbody id="menuBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <dialog id="menuDialog">
    <form id="menuForm" novalidate>
      <h2 id="menuTitle">Thêm món</h2>
      <div class="field">
        <label for="name">Tên món</label>
        <input type="text" id="name" name="name" autocomplete="off">
        <span class="err" data-err="name"></span>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="category">Nhóm</label>
          <select id="category" name="category"><option value="">Chọn nhóm</option><option>Cà phê</option><option>Trà</option><option>Sinh tố &amp; nước ép</option><option>Bánh ngọt</option></select>
          <span class="err" data-err="category"></span>
        </div>
        <div class="field">
          <label for="price">Giá (đồng)</label>
          <input type="number" id="price" name="price" min="1000" step="1000" inputmode="numeric">
          <span class="err" data-err="price"></span>
        </div>
      </div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="cancelBtn">Hủy</button>
        <button type="submit" class="btn btn-primary">Lưu món</button>
      </div>
    </form>
  </dialog>

  <script src="../js/common.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
