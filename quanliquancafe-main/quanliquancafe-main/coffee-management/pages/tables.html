<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bàn – Góc Phố Coffee</title>
  <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../" data-page="tables">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button>
        <h1>Bàn</h1>
        <div class="userbox" id="userBox"></div>
      </header>
      <main class="content">
        <div class="page-head">
          <p class="lead" id="summary"></p>
          <div class="chips" id="filters" role="group" aria-label="Lọc theo trạng thái">
            <button type="button" class="chip" data-f="all" aria-pressed="true">Tất cả</button>
            <button type="button" class="chip" data-f="free" aria-pressed="false">Trống</button>
            <button type="button" class="chip" data-f="busy" aria-pressed="false">Có khách</button>
            <button type="button" class="chip" data-f="reserved" aria-pressed="false">Đặt trước</button>
          </div>
        </div>
        <div class="floor" id="floor"></div>
      </main>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script>
    (function () {
      'use strict';
      if (!CF.user) return;
      var data = CF.load();
      var filter = 'all';
      var LABEL = { free: 'Trống', busy: 'Có khách', reserved: 'Đặt trước' };
      var BADGE = { free: 'ok', busy: 'busy', reserved: 'resv' };

      function openOrderOf(tableId) {
        return data.orders.filter(function (o) { return o.status === 'open' && o.tableId === tableId; })[0];
      }

      function render() {
        var counts = { free: 0, busy: 0, reserved: 0 };
        data.tables.forEach(function (t) { counts[t.status]++; });
        document.getElementById('summary').textContent = counts.free + ' bàn trống · ' + counts.busy + ' bàn có khách · ' + counts.reserved + ' bàn đặt trước';

        var list = data.tables.filter(function (t) { return filter === 'all' || t.status === filter; });
        document.getElementById('floor').innerHTML = list.length ? list.map(function (t) {
          var seats = '';
          for (var i = 0; i < t.seats; i++) seats += '<i></i>';
          var o = openOrderOf(t.id);
          var sum = o ? CF.money(CF.orderTotal(o.items)) : '&nbsp;';
          return '<article class="tile ' + t.status + '">' +
            '<header><h3>' + CF.esc(t.name) + '</h3><span class="badge ' + BADGE[t.status] + '">' + LABEL[t.status] + '</span></header>' +
            '<div class="seats" aria-label="' + t.seats + ' chỗ ngồi">' + seats + '</div>' +
            '<p class="sum">' + sum + '</p>' +
            '<label class="sr-only" for="st-' + t.id + '">Trạng thái ' + CF.esc(t.name) + '</label>' +
            '<select id="st-' + t.id + '" data-table="' + t.id + '">' +
              ['free', 'busy', 'reserved'].map(function (s) { return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + LABEL[s] + '</option>'; }).join('') +
            '</select>' +
            '<a class="btn btn-sm ' + (o ? 'btn-accent' : '') + '" href="orders.html?table=' + t.id + '">' + (o ? 'Xem order' : 'Tạo order') + '</a>' +
          '</article>';
        }).join('') : '<p class="empty">Không có bàn nào ở trạng thái này.</p>';
      }

      document.getElementById('floor').addEventListener('change', function (e) {
        var sel = e.target.closest('[data-table]'); if (!sel) return;
        var t = data.tables.filter(function (x) { return x.id === sel.getAttribute('data-table'); })[0];
        if (sel.value === 'free' && openOrderOf(t.id)) {
          CF.toast(t.name + ' còn order chưa thanh toán. Hãy thanh toán hoặc hủy order trước.', 'error');
          sel.value = t.status; return;
        }
        t.status = sel.value; CF.save(data); render();
        CF.toast(t.name + ' chuyển sang "' + LABEL[t.status] + '".');
      });

      document.getElementById('filters').addEventListener('click', function (e) {
        var b = e.target.closest('[data-f]'); if (!b) return;
        filter = b.getAttribute('data-f');
        document.querySelectorAll('#filters .chip').forEach(function (c) { c.setAttribute('aria-pressed', c === b); });
        render();
      });
      render();
    })();
  </script>
</body>
</html>
