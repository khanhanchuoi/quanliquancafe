<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hóa đơn – Góc Phố Coffee</title>
  <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../" data-page="invoices">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button>
        <h1>Hóa đơn</h1>
        <div class="userbox" id="userBox"></div>
      </header>
      <main class="content">
        <div class="toolbar">
          <input type="text" id="search" class="search" placeholder="Tìm theo mã hóa đơn hoặc bàn" aria-label="Tìm hóa đơn">
          <label class="sr-only" for="dateFilter">Lọc theo ngày</label>
          <input type="date" id="dateFilter" style="width:auto">
          <button type="button" class="btn" id="clearDate">Bỏ lọc ngày</button>
          <span class="grow"></span>
          <strong id="sumBox"></strong>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Mã</th><th>Bàn</th><th>Thời gian</th><th>Hình thức</th><th class="right">Tổng tiền</th><th><span class="sr-only">Thao tác</span></th></tr></thead>
            <tbody id="invBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <dialog id="invDialog">
    <div class="dlg-body">
      <h2>Góc Phố Coffee</h2>
      <p class="muted" id="invMeta"></p>
      <table class="invoice-lines">
        <thead><tr><th>Món</th><th>SL</th><th>Thành tiền</th></tr></thead>
        <tbody id="invLines"></tbody>
      </table>
      <div class="total-row"><span>Tổng cộng</span><span id="invTotal"></span></div>
      <p class="muted" id="invPay"></p>
      <div class="dlg-actions">
        <button type="button" class="btn" id="invClose">Đóng</button>
        <button type="button" class="btn btn-primary" id="invPrint">In hóa đơn</button>
      </div>
    </div>
  </dialog>

  <script src="../js/common.js"></script>
  <script>
    (function () {
      'use strict';
      if (!CF.user) return;
      var data = CF.load();
      var $ = function (id) { return document.getElementById(id); };

      function filtered() {
        var q = $('search').value.trim().toLowerCase();
        var day = $('dateFilter').value;
        return data.invoices.filter(function (i) {
          var okQ = !q || i.id.toLowerCase().indexOf(q) !== -1 || i.tableName.toLowerCase().indexOf(q) !== -1;
          var okD = !day || CF.dayKey(i.paidAt) === day;
          return okQ && okD;
        }).sort(function (a, b) { return new Date(b.paidAt) - new Date(a.paidAt); });
      }

      function render() {
        var rows = filtered();
        var sum = rows.reduce(function (s, i) { return s + i.total; }, 0);
        $('sumBox').textContent = rows.length + ' hóa đơn · ' + CF.money(sum);
        $('invBody').innerHTML = rows.length ? rows.map(function (i) {
          return '<tr><td><strong>' + i.id + '</strong></td><td>' + CF.esc(i.tableName) + '</td><td>' + CF.dateTime(i.paidAt) + '</td><td>' + CF.esc(i.method) +
            '</td><td class="right">' + CF.money(i.total) + '</td><td><div class="actions"><button type="button" class="btn btn-sm" data-view="' + i.id + '">Xem</button></div></td></tr>';
        }).join('') : '<tr><td colspan="6" class="empty">Không có hóa đơn nào khớp. Thử bỏ bớt bộ lọc.</td></tr>';
      }

      $('invBody').addEventListener('click', function (e) {
        var b = e.target.closest('[data-view]'); if (!b) return;
        var inv = data.invoices.filter(function (i) { return i.id === b.getAttribute('data-view'); })[0];
        $('invMeta').textContent = 'Hóa đơn ' + inv.id + ' · ' + inv.tableName + ' · ' + CF.dateTime(inv.paidAt);
        $('invLines').innerHTML = inv.items.map(function (it) {
          return '<tr><td>' + CF.esc(it.name) + '</td><td>' + it.qty + '</td><td>' + CF.money(it.price * it.qty) + '</td></tr>';
        }).join('');
        $('invTotal').textContent = CF.money(inv.total);
        $('invPay').textContent = 'Thanh toán bằng ' + inv.method.toLowerCase() + '. Cảm ơn quý khách!';
        $('invDialog').showModal();
      });
      $('invClose').onclick = function () { $('invDialog').close(); };
      $('invPrint').onclick = function () { window.print(); };
      $('search').addEventListener('input', render);
      $('dateFilter').addEventListener('change', render);
      $('clearDate').onclick = function () { $('dateFilter').value = ''; render(); };
      render();
    })();
  </script>
</body>
</html>
